[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.pdo_pgsql", "php82Extensions.pgsql", "php82Extensions.intl", "php82Extensions.mbstring"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "mkdir -p writable/cache writable/logs writable/session && php -S 0.0.0.0:$PORT -t public public/router.php"

[variables]
PHP_VERSION = "8.2"
CI_ENVIRONMENT = "production"
