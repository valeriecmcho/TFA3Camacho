[build]
builder = "RAILPACK"

[build.env]
PHP_VERSION = "8.2"
CI_ENVIRONMENT = "production"

# Start command for Railway deployment
[start]
cmd = "php -S 0.0.0.0:$PORT -t public"

# Database configuration will be provided by Railway
# DATABASE_URL is automatically set when you add a PostgreSQL service

# Optional: Set encryption key for production
# Generate with: php spark key:generate
# encryption.key = "your-generated-key-here"
